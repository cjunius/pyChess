[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pychess"
description = "A UCI chess engine: Lazy SMP negamax with a tapered PeSTO evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "cjunius" }]
keywords = ["chess", "uci", "engine", "negamax", "lazy-smp", "pesto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["chess==1.10.0"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov>=6",
    "ruff==0.14.4",
    "mypy==1.18.2",
    "pre-commit>=3",
]

[project.scripts]
pychess = "pychess.__main__:main"

[project.urls]
Repository = "https://github.com/cjunius/pyChess"
Issues = "https://github.com/cjunius/pyChess/issues"
Changelog = "https://github.com/cjunius/pyChess/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pychess/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pychess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pychess --cov-report=term-missing --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/pychess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["pychess"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# Test functions don't need full annotations, but their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
